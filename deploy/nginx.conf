# Mirrors firebase.json, so the container and Firebase Hosting serve the same bytes the same way.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The export uses trailingSlash, so /app/queue/ is a directory holding index.html. Anything the
  # filesystem does not answer falls back to the app shell, which is what makes client routing work.
  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }

  # Hashed build output never changes under the same name.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /brand/ {
    add_header Cache-Control "public, max-age=604800";
  }
  # HTML must not be cached, or a deploy is invisible until the browser gives up on it.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}
