name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly on a fork or before the service account secret is added, rather than failing.
    if: github.repository == 'Ergplan/bessstudio'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          # The rest of the web app configuration is committed in src/platform/firebaseConfig.ts.
          # The key identifies the project rather than authorising anything, but it is kept out of
          # the repository so a build can be pointed at another project.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: npm run build
      - name: Deploy hosting, rules and indexes
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: bessstudio-e55e1
          channelId: live
